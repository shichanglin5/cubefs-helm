{{- if .Values.component.metanode }}
{{- $envAll := . }}

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cubefs-meta
  namespace: {{ .Release.Namespace }}
  labels:
{{ tuple $envAll .Release.Namespace "metanode" | include "helm-toolkit.metadata_labels" | indent 4 }}

spec:
  selector:
    matchLabels:
{{ tuple $envAll .Release.Namespace "metanode" | include "helm-toolkit.metadata_labels" | indent 6 }}
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
      honorLabels: false
      relabelings:
        - targetLabel: job
          replacement: cubefs-meta
          action: replace
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          targetLabel: role
          regex: (.+)
          replacement: $1
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: cluster
          regex: ^cubefs-(.+)$
          replacement: $1
      metricRelabelings:
        - action: labeldrop
          regex: ^(namespace|__meta_kubernetes_namespace)$
{{ end }}

