# Select which component to install
component:
  master: true
  metanode: true
  datanode: false
  objectnode: false
  client: true
  csi: false
  monitor: false
  ingress: false
  blobstore_clustermgr: false
  blobstore_blobnode: false
  blobstore_proxy: false
  blobstore_scheduler: false
  blobstore_access: false
log:
  do_not_redirect_std: true
image:
  server: docker.17usoft.com/lhhdz/cubefs/cfs-server:dev
  client: docker.17usoft.com/lhhdz/cubefs/cfs-client:dev
  pull_policy: "Always"
master:
  # The replicas of master component, at least 3, recommend to be an odd number
  replicas: 3
  # Cluster name
  cluster: jfscubefs-dev
  # NodeSelector
  nodeSelector:
    "component.cubefs.io/master": "enabled"
  path:
    log: /data/logs/infss.cubefs.master
  tolerations: []
  host: master.cubefs.com
  log_level: error
  retain_logs: 2000
  # Master service http port
  port: 17010
  # Master golang pprof port
  prof: 17020
  exporter_port: 9500
  # Reserved memory in bytes for each metanode, if available memory less than this value, the metanode will be unwritable
  metanode_reserved_mem: "67108864"
  legacy_data_media_type: 1
  resources:
    enabled: false
    requests:
      memory: "8Gi"
      cpu: "2000m"
    limits:
      memory: "32Gi"
      cpu: "8000m"

metanode:
  # NodeSelector for metanode daemonset
  nodeSelector:
    "component.cubefs.io/metanode": "enabled"
  path:
    log: /data/logs/infss.cubefs.meta
    # raft WAL 独立挂载到 /data_sdc/cubefs-meta/raft（宿主机磁盘 sdc）
    # 容器内挂载点为 /cfs/raft，通过 config_override 将 raftDir 指向此路径
    # 目录不存在时 kubelet 会自动创建
    raft: /data_sdc/cubefs-meta/raft
  tolerations: []
  log_level: error
  # Total memory metanode can use, recommended to be configured
  # as 80% of physical machine memory
  total_mem: "26843545600"
  mem_ratio: "50"
  port: 17210
  prof: 17220
  raft_heartbeat: 17230
  raft_replica: 17240
  exporter_port: 9510
  resources:
    enabled: true
    requests:
      memory: "32Gi"
      cpu: "2000m"
    limits:
      memory: "256Gi"
      cpu: 32
  # 覆盖 raftDir 到独立磁盘挂载点
  config_override: |
    {
      "raftDir": "/cfs/raft"
    }

client:
  vol_name: "jfscubefs"
